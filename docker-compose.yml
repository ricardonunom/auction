services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: auctions
      POSTGRES_USER: auctions
      POSTGRES_PASSWORD: auctions
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql   # Postgres 18+ mounts the parent dir, not /data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auctions -d auctions"]
      interval: 5s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # create topics explicitly, like in prod

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  redis:
    image: redis:8.8.3
    ports:
      - "6379:6379"

volumes:
  postgres-data:
